    <!-- Event snippet for 购买 conversion page

<script>
function gtag_report_conversion(url) {
  var callback = function () {
    if (typeof(url) != 'undefined') {
      window.location = url;
    }
  };
  gtag('event', 'conversion', {
      'send_to': 'AW-18261237913/wAZwCP-72u8cEJnB0YNE',
      'transaction_id': '',
      'event_callback': callback
      // 'new_customer': true /* calculate dynamically, populate with true/false */,
  });
  return false;
}
</script>


    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* 页面容器 - 使用flex布局，图片占满剩余空间，按钮固定在底部 */
        .page {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
        }

        /* 图片容器 - 弹性撑满，居中显示图片 */
        .image-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #ffffff;
            padding: 0;
            /* 为底部按钮留出空间，但不占位，让按钮浮在底部 */
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* 保持宽高比，完整显示图片 */
            display: block;
            background-color: #ffffff;
        }

        /* 底部固定按钮 - 使用fixed定位，始终在可视区域底部 */
        .bottom-btn {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            padding: 16px 20px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            /* 适配iPhone安全区域 */
            background: linear-gradient(135deg, #4A90D9, #357ABD);
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 2px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
            z-index: 999;
            border-radius: 0;
            /* 去掉默认圆角 */
            -webkit-tap-highlight-color: transparent;
            /* 去掉移动端点击高亮 */
            user-select: none;
            -webkit-user-select: none;
        }

        /* 按钮按下状态（移动端反馈） */
        .bottom-btn:active {
            background: linear-gradient(135deg, #3A7BC8, #2E6BA8);
            transform: scale(0.98);
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.20);
        }

        /* 可选：给按钮添加一个小图标或装饰 (纯文字) */
        .bottom-btn .btn-text {
            display: inline-block;
            position: relative;
        }

        .bottom-btn .btn-text::after {
            content: " →";
            font-weight: 300;
            opacity: 0.8;
        }

        /* 针对一些旧版安卓浏览器优化 */
        @media screen and (max-width: 480px) {
            .bottom-btn {
                font-size: 18px;
                padding: 14px 16px;
                padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            }
        }

        /* 针对刘海屏/全面屏安全区域适配 */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .bottom-btn {
                padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            }
        }

        /* 如果图片加载失败，显示占位背景 */
        .image-wrapper img::after {
            content: "图片加载失败";
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="page">
        <!-- 图片展示区域 -->
        <div class="image-wrapper">
            <img src="img/1.png" alt="" id="mainImage">
        </div>

        <!-- 底部固定按钮 -->
        <button class="bottom-btn" id="actionBtn" onclick="k2()">
            <span class="btn-text">Sofort kontaktieren</span>
        </button>
    </div>

    <script>
        /**
         * k2 方法 - 跳转到 qq.com
         * 使用 window.location.href 进行跳转
         * 同时兼容 iOS 和 Android
         */
        function k2() {
              gtag_report_conversion('https://lihi1.me/4oS0H');
           // window.location.href = 'https://www.qq.com';
            // 备用方案：如果上面被拦截，可以使用以下方式
            // window.open('https://www.qq.com', '_self');
        }

        // 可选：在控制台暴露 k2 方法，方便调试
        console.log('H5页面已加载，点击底部按钮调用 k2() 跳转 qq.com');

        // 监听页面加载完成，确保图片正常显示
        document.addEventListener('DOMContentLoaded', function() {
            const img = document.getElementById('mainImage');
            if (img) {
                img.onerror = function() {
                    // 图片加载失败时的备用显示（可选）
                    console.warn('图片加载失败，请检查路径 img/1.png');
                    // 可以设置一个占位背景色或文字
                    this.style.backgroundColor = '#f0f0f0';
                    this.alt = '图片加载失败';
                };
                img.onload = function() {
                    console.log('图片加载成功');
                };
            }
        });

        // 防止按钮点击时页面滚动或误触
        document.getElementById('actionBtn').addEventListener('touchstart', function(e) {
            // 无额外操作，保留默认点击反馈
        }, { passive: true });
    </script>

</body>
</html>
